data_cfg:
  rgb: true
  depth: true
  semantic: true
  resolution:
    w: 1080
    h: 720
  camera_height: 1.5

# Trajectory parameters
num_waypoints: 20       # random waypoints to connect via ShortestPathFollower
max_steps_per_leg: 500  # max steps between consecutive waypoints
sample_every: 1         # save every N steps (1 = save all)
